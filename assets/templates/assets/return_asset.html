<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Return Asset</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 80px;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .navbar a {
            color: #4a5568;
            text-align: center;
            padding: 20px 30px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            letter-spacing: 0.3px;
        }

        .navbar a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .navbar a:hover {
            color: #667eea;
        }

        .navbar a:hover::after {
            width: 80%;
        }

        .page-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 100px 20px 40px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 40px;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            position: relative;
            padding-bottom: 20px;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            font-weight: 600;
            margin-bottom: 10px;
            color: #4a5568;
            font-size: 15px;
            display: block;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        select {
            width: 100%;
            padding: 14px 18px;
            font-size: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-family: inherit;
            background: white;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[type="number"] {
            appearance: textfield;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        select {
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23667eea"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 24px;
            padding-right: 40px;
            cursor: pointer;
        }

        button[type="submit"] {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        button[type="submit"]:active {
            transform: translateY(-1px);
        }

        .error-message {
            color: #e53e3e;
            font-size: 14px;
            margin-top: 8px;
            padding: 10px;
            background: #fff5f5;
            border-radius: 6px;
            border-left: 3px solid #e53e3e;
        }

        footer {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            color: white;
            text-align: center;
            padding: 20px 0;
            position: fixed;
            bottom: 0;
            width: 100%;
            font-size: 14px;
            letter-spacing: 0.3px;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-wrap: wrap;
            }

            .navbar a {
                padding: 15px 20px;
                font-size: 14px;
            }

            .container {
                padding: 35px 25px;
            }

            h1 {
                font-size: 26px;
            }

            .page-wrapper {
                padding: 90px 15px 30px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 22px;
            }

            .container {
                padding: 30px 20px;
            }

            input[type="text"],
            input[type="number"],
            input[type="date"],
            select {
                padding: 12px 15px;
                font-size: 14px;
            }

            button[type="submit"] {
                padding: 14px 35px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="{% url 'index' %}">Home</a>
        <a href="{% url 'home' %}">Asset</a>
        <a href="{% url 'track' %}">Track Assets</a>
        <a href="{% url 'maintenance' %}">Assets Maintenance</a>
        <a class="nav-link" href="{% url 'logout' %}">Logout</a>
    </div>

    <div class="page-wrapper">
        <div class="container">
            <h1>Return Asset</h1>
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_lend">Lend:</label>
                    {{ form.lend }}
                </div>
                <div class="form-group">
                    <label for="id_returned_date">Returned Date:</label>
                    {{ form.returned_date }}
                </div>
                <div class="form-group">
                    <label for="id_condition">Condition:</label>
                    {{ form.condition }}
                </div>
                <div class="form-group">
                    <label for="id_quantity_good">Quantity in Good Condition:</label>
                    {{ form.quantity_good }}
                </div>
                <div class="form-group">
                    <label for="id_quantity_bad">Quantity in Bad Condition:</label>
                    {{ form.quantity_bad }}
                </div>
                <button type="submit">Return</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Swahilipot Hub. All rights reserved.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const quantityGoodInput = document.querySelector('input[name="quantity_good"]');
            const quantityBadInput = document.querySelector('input[name="quantity_bad"]');
            const totalQuantity = parseInt('{{ total_quantity }}', 10);

            quantityGoodInput.addEventListener('input', function () {
                const quantityGood = parseInt(quantityGoodInput.value, 10) || 0;
                const quantityBad = totalQuantity - quantityGood;
                quantityBadInput.value = quantityBad >= 0 ? quantityBad : 0;
            });
        });
    </script>
</body>
</html>
